<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E2319" />
      <stop offset="100%" stop-color="#06120D" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A7F3D0" />
      <stop offset="40%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84CC16" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.9" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#10B981" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="none" stroke="url(#ringGrad)" stroke-width="4" stroke-opacity="0.4"/>
  <circle cx="256" cy="256" r="185" fill="#11291D" stroke="#1D4A35" stroke-width="3"/>

  <g filter="url(#glow)" transform="translate(0, -5)">
    <!-- Tierra fértil curvada -->
    <path d="M150,360 C190,340 322,340 362,360 C332,385 220,385 150,360 Z" fill="#854D0E" opacity="0.85"/>
    
    <!-- Tallo principal -->
    <path d="M256,350 C256,260 250,210 256,160" stroke="url(#sproutGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Hoja izquierda -->
    <path d="M252,240 C190,230 150,165 170,140 C210,140 245,190 252,240 Z" fill="url(#sproutGrad)"/>
    <path d="M170,140 C195,175 225,205 252,240" stroke="#047857" stroke-width="3" fill="none"/>

    <!-- Hoja derecha -->
    <path d="M258,200 C320,190 360,125 340,100 C300,100 265,150 258,200 Z" fill="url(#leafGrad)"/>
    <path d="M340,100 C315,135 285,165 258,200" stroke="#14532D" stroke-width="3" fill="none"/>

    <!-- Brote superior -->
    <circle cx="256" cy="155" r="12" fill="#FDE047"/>
  </g>

  <!-- Tag inferior CULTIVOS -->
  <rect x="156" y="416" width="200" height="34" rx="17" fill="#059669" />
  <text x="256" y="439" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">CULTIVOS</text>
</svg>